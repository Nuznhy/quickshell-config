# Quickshell tmux color bindings v1
# Preserve the original layout; resolve shell colors at render time.
# Removing the generated palette returns to the original Rosé Pine colors.
set-option -g @quickshell-config-theme 1

set -g status-style "bg=#{?@quickshell_bg,#{@quickshell_bg},#191724},fg=#{?@quickshell_text,#{@quickshell_text},#e0def4}"
set -g pane-border-style "fg=#{?@quickshell_overlay,#{@quickshell_overlay},#26233a}"
set -g pane-active-border-style "fg=#{?@quickshell_iris,#{@quickshell_iris},#c4a7e7}"
set -g message-style "bg=#{?@quickshell_overlay,#{@quickshell_overlay},#26233a},fg=#{?@quickshell_text,#{@quickshell_text},#e0def4}"
set -g message-command-style "bg=#{?@quickshell_overlay,#{@quickshell_overlay},#26233a},fg=#{?@quickshell_gold,#{@quickshell_gold},#f6c177}"
set -g mode-style "bg=#{?@quickshell_pine,#{@quickshell_pine},#31748f},fg=#{?@quickshell_on_pine,#{@quickshell_on_pine},#191724},bold"
set -g window-status-format " #[fg=#{?@quickshell_subtle,#{@quickshell_subtle},#908caa}]#I #[fg=#{?@quickshell_muted,#{@quickshell_muted},#6e6a86}]#W "
set -g window-status-current-format "#[fg=#{?@quickshell_iris,#{@quickshell_iris},#c4a7e7},bg=#{?@quickshell_bg,#{@quickshell_bg},#191724}]#[fg=#{?@quickshell_on_iris,#{@quickshell_on_iris},#191724},bg=#{?@quickshell_iris,#{@quickshell_iris},#c4a7e7},bold] #I:#W #[fg=#{?@quickshell_iris,#{@quickshell_iris},#c4a7e7},bg=#{?@quickshell_bg,#{@quickshell_bg},#191724}]"
set -g window-status-current-style "fg=#{?@quickshell_iris,#{@quickshell_iris},#c4a7e7},bold"
set -g status-left "#[fg=#{?@quickshell_rose,#{@quickshell_rose},#ebbcba},bg=default]#[fg=#{?@quickshell_on_rose,#{@quickshell_on_rose},#191724},bg=#{?@quickshell_rose,#{@quickshell_rose},#ebbcba},bold] #S #[fg=#{?@quickshell_rose,#{@quickshell_rose},#ebbcba},bg=#{?@quickshell_bg,#{@quickshell_bg},#191724}]"
set -g status-right "#[fg=#{?@quickshell_overlay,#{@quickshell_overlay},#26233a},bg=#{?@quickshell_bg,#{@quickshell_bg},#191724}]#[fg=#{?@quickshell_text,#{@quickshell_text},#e0def4},bg=#{?@quickshell_overlay,#{@quickshell_overlay},#26233a}] %Y-%m-%d #[fg=#{?@quickshell_foam,#{@quickshell_foam},#9ccfd8},bg=#{?@quickshell_overlay,#{@quickshell_overlay},#26233a}] %H:%M #[fg=#{?@quickshell_overlay,#{@quickshell_overlay},#26233a},bg=#{?@quickshell_bg,#{@quickshell_bg},#191724}]"
set -g window-status-activity-style "fg=#{?@quickshell_gold,#{@quickshell_gold},#f6c177},bold"

# Optional palette, generated by Quickshell Application themes.
source-file -qF "#{d:current_file}/quickshell-config.conf"
